apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-broken
  labels:
    app: task-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api-wrong
    spec:
      containers:
        - name: task-api
          image: task-api:typo
          ports:
            - containerPort: 9090
